name: build-android-app
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:            # "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Restore signing key (same key every build, so updates install over the old app)
        run: base64 -d android/app/debug.keystore.b64 > android/app/debug.keystore
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FXSignals.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FXSignals-apk
          path: FXSignals.apk
      - name: Publish as a release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: FX Signals app v1.0.${{ github.run_number }}
          body: Download FXSignals.apk below and open it on your Android phone to install or update.
          files: FXSignals.apk
