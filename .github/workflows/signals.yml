name: forex-signals
on:
  schedule:
    - cron: "*/5 * * * 0-5"    # every 5 min, Sun-Fri (forex market hours, UTC)
  workflow_dispatch:            # lets you press "Run workflow" by hand
  push:                         # also runs right after you upload or change the bot files
    paths:
      - ".github/workflows/signals.yml"
      - "*.py"
      - "requirements.txt"
    branches: [main]
permissions:
  contents: write
concurrency: signals
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save signals and logs (for the app, and to avoid duplicates)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add sent_signals.json
          if [ -f signals.json ]; then git add signals.json; fi
          if [ -d logs ]; then git add -A logs; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scan $(date -u +%H:%M) UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Save retry $i"; sleep 10
          done
          exit 1
