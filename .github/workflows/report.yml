name: strategy-report
on:
  workflow_dispatch:            # "Run workflow" button
  push:
    paths:
      - "report.py"
      - ".github/workflows/report.yml"
permissions:
  contents: write
concurrency: report
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python report.py
      - name: Save the report
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add backtest_report.md backtest_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "strategy report"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Save retry $i"; sleep 10
          done
          exit 1
