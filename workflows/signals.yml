name: forex-signals
on:
  schedule:
    - cron: "*/15 * * * 0-5"   # every 15 min, Sun-Fri (forex market hours, UTC)
  workflow_dispatch:            # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency: signals
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save signals (for the app, and to avoid duplicates)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add sent_signals.json
          if [ -f signals.json ]; then git add signals.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "new signals"
          git pull --rebase
          git push
